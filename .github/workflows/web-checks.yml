name: Madang checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://test.supabase.co/rest/v1/
          VITE_SUPABASE_ANON_KEY: synthetic-public-key-not-a-real-credential
          GEMINI_API_KEY: MADANG_SYNTHETIC_SERVER_BUILD_SENTINEL
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PLAYWRIGHT_PRODUCTION: '1'
