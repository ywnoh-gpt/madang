name: Journal checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build_web.cjs
      - name: Check that the standalone HTML matches its sources
        run: git diff --exit-code -- index.html
      - run: node --test tests/*.test.cjs
